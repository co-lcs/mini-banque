spring:
  application:
    name: mini-banque
  h2:
    console:
      enabled: true
      path: /h2
  datasource:
    url: jdbc:h2:mem:mydb
  jpa:
    properties:
      hibernate:
        format_sql: true # Formate et rend le SQL plus lisible

logging:
  level:
    org.hibernate.SQL: DEBUG # Active les logs de niveau DEBUG pour les requetes SQL